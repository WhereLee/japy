server:
  port: 8085

spring:
  application:
    name: japy-framework
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/japy_moments
    username: postgres
    password: root
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

# RocketMQ（本机：D:\rocketmq-5.3.1，NameServer 9876）
rocketmq:
  name-server: localhost:9876
  producer-group: japy-framework-producer
  consumer-group: japy-framework-consumer
  topics:
    oper-log: japy_oper_log

# JWT（生产环境通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:japy-framework-secret-key-must-be-at-least-256-bits-long!!}
  access-expire: 7200          # access token 有效期（秒）2h
  refresh-expire: 604800       # refresh token 有效期（秒）7d

# CORS 白名单（前后端分离部署时按实际域名配置）
cors:
  allowed-origins: http://localhost:3002,http://localhost:3003,http://localhost:5173

# Actuator：仅暴露健康检查与信息（不暴露 env/beans 等敏感端点）
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 登录防爆破
login:
  max-fail: 5                  # 连续失败 N 次锁定
  lock-minutes: 30             # 锁定时长（分钟）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
