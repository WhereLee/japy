server:
  port: 8085

spring:
  application:
    name: japy-framework
  profiles:
    # 本地开发默认加载 application-local.yml（含密钥，不入库）；测试用 @ActiveProfiles("test") 覆盖
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/japy_moments
    username: postgres
    password: root
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

# RocketMQ（本机：D:\rocketmq-5.3.1，NameServer 9876）
rocketmq:
  name-server: localhost:9876
  producer-group: japy-framework-producer
  consumer-group: japy-framework-consumer
  topics:
    oper-log: japy_oper_log

# AI 运维分析顾问（Monitor Agent）
ai:
  llm:
    # API key：本地走 application-local.yml，生产走环境变量 DEEPSEEK_API_KEY，绝不写死入库
    api-key: ${DEEPSEEK_API_KEY:}
    # base-url/model 默认与 sys_config 一致，可用参数管理覆盖
    base-url: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    timeout-seconds: 30
  monitor:
    # 检测调度间隔（毫秒）
    scheduler-interval-ms: 1800000
    # 即时通知的最小严重级别（2警告 3严重）
    notify-severity: 3

# 日志多级降级（RocketMQ → Redis Stream → 同步落库；Redis 需 ≥ 5.0）
mq:
  fallback:
    # Redis Stream 缓冲 key
    stream-key: japy:log:fallback-stream
    # MQ 恢复探测间隔（毫秒）
    probe-interval-ms: 60000

# JWT（生产环境通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:japy-framework-secret-key-must-be-at-least-256-bits-long!!}
  access-expire: 7200          # access token 有效期（秒）2h
  refresh-expire: 604800       # refresh token 有效期（秒）7d

# CORS 白名单（前后端分离部署时按实际域名配置）
cors:
  allowed-origins: http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:5173

# Actuator：仅暴露健康检查与信息（不暴露 env/beans 等敏感端点）
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 登录防爆破
login:
  max-fail: 5                  # 连续失败 N 次锁定
  lock-minutes: 30             # 锁定时长（分钟）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /doc.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
