server:
  port: 8084

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/japy_moments
    username: postgres
    password: root
  sql:
    init:
      mode: never   # 测试不重建表结构，使用开发库已建好的表

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
