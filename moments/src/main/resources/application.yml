server:
  port: 8083
  tomcat:
    accesslog:
      enabled: true
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      pattern: '%t %m %U %s %Dms'

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/japy_moments
    username: postgres
    password: root
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# 小说上传产物根目录（相对启动目录；目录结构：{novels-dir}/{小说名}/{source|chapters|stats}）
app:
  novels-dir: novels

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
