# 生产环境配置
# 禁用 API 文档暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false

# 生产环境数据库初始化禁用
spring:
  sql:
    init:
      mode: never

# 生产环境 Actuator 只暴露 health，隐藏细节
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
