<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼象 · 管理后台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--like:#f85149;--green:#3fb950}
        body{font-family:-apple-system,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .container{max-width:900px;margin:0 auto;padding:20px 16px}
        h1{font-size:20px;margin-bottom:16px}
        .hidden{display:none}
        input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px}
        input:focus{border-color:var(--accent);outline:none}
        .btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer}
        .btn:hover{opacity:.85}
        .btn-danger{background:var(--like)}
        .btn-outline{background:none;border:1px solid var(--border);color:var(--dim)}
        .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
        /* 登录 */
        .login-box{max-width:320px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px}
        .login-box h2{font-size:16px;margin-bottom:14px;text-align:center}
        .login-box input{width:100%;margin-bottom:10px}
        .login-box .error{color:var(--like);font-size:12px;margin-bottom:8px;display:none}
        /* 导航 */
        .nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
        .nav button{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--dim);font-size:12px;cursor:pointer}
        .nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
        /* 面板 */
        .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
        .panel h3{font-size:14px;margin-bottom:12px}
        /* 表格 */
        table{width:100%;border-collapse:collapse;font-size:12px}
        th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
        th{color:var(--dim);font-weight:500}
        td .actions{display:flex;gap:4px;flex-wrap:wrap}
        /* 统计 */
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
        .stat-card .num{font-size:24px;font-weight:700;color:var(--accent)}
        .stat-card .label{font-size:12px;color:var(--dim);margin-top:4px}
        .toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
        .empty{text-align:center;color:var(--dim);padding:20px;font-size:13px}
    </style>
</head>
<body>
<div class="container">
    <h1>拼象 · 管理后台</h1>

    <!-- 登录 -->
    <div id="loginSection">
        <div class="login-box">
            <h2>管理员登录</h2>
            <div class="error" id="loginError"></div>
            <input id="loginUser" placeholder="用户名">
            <input id="loginPwd" type="password" placeholder="密码">
            <button class="btn" style="width:100%" onclick="adminLogin()">登录</button>
        </div>
    </div>

    <!-- 主面板 -->
    <div id="adminSection" class="hidden">
        <div class="nav">
            <button class="active" onclick="switchTab('dashboard',this)">概览</button>
            <button onclick="switchTab('users',this)">用户</button>
            <button onclick="switchTab('posts',this)">帖子</button>
            <button onclick="switchTab('reports',this)">举报</button>
            <button onclick="switchTab('words',this)">敏感词</button>
            <button onclick="switchTab('announce',this)">公告</button>
            <button onclick="switchTab('logs',this)">日志</button>
            <button onclick="location.href='/'" style="margin-left:auto">返回前台</button>
        </div>
        <div id="tabContent"></div>
    </div>
</div>

<script>
let token=localStorage.getItem('admin_token')||'';
function headers(){return{'Content-Type':'application/json','Authorization':'Bearer '+token}}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function adminLogin(){const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPwd').value;const err=document.getElementById('loginError');const r=await(await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})).json();if(r.code!==200){err.textContent=r.msg;err.style.display='block';return}token=r.data.token;localStorage.setItem('admin_token',token);document.getElementById('loginSection').classList.add('hidden');document.getElementById('adminSection').classList.remove('hidden');switchTab('dashboard',document.querySelector('.nav button'))}

function switchTab(tab,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const el=document.getElementById('tabContent');if(tab==='dashboard')loadDashboard(el);else if(tab==='users')loadUsers(el);else if(tab==='posts')loadPosts(el);else if(tab==='reports')loadReports(el);else if(tab==='words')loadWords(el);else if(tab==='announce')loadAnnounce(el);else if(tab==='logs')loadLogs(el)}

// ===== Dashboard =====
async function loadDashboard(el){const{data}=await(await fetch('/api/admin/dashboard',{headers:headers()})).json();el.innerHTML=`<div class="stats"><div class="stat-card"><div class="num">${data.userCount}</div><div class="label">用户</div></div><div class="stat-card"><div class="num">${data.postCount}</div><div class="label">帖子</div></div><div class="stat-card"><div class="num">${data.commentCount}</div><div class="label">评论</div></div><div class="stat-card"><div class="num">${data.pendingReports}</div><div class="label">待处理举报</div></div></div>`}

// ===== 用户管理 =====
async function loadUsers(el){const{data}=await(await fetch('/api/admin/users?page=1&size=20',{headers:headers()})).json();el.innerHTML=`<div class="panel"><h3>用户管理</h3><div class="toolbar"><input id="userSearch" placeholder="搜索用户名/昵称" style="width:200px"><button class="btn" onclick="searchUsers()">搜索</button></div><table><tr><th>ID</th><th>用户名</th><th>昵称</th><th>状态</th><th>操作</th></tr>${data.list.map(u=>`<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.nickname)}</td><td>${u.status===1?'<span style="color:var(--like)">封禁</span>':'正常'}</td><td class="actions">${u.status===0?`<button class="btn btn-danger" onclick="banUser(${u.id})">封禁</button>`:`<button class="btn" onclick="unbanUser(${u.id})">解封</button>`}<button class="btn btn-outline" onclick="resetPwd(${u.id})">重置密码</button><button class="btn btn-outline" onclick="forceNick(${u.id})">改昵称</button></td></tr>`).join('')}</table></div>`}
async function searchUsers(){const q=document.getElementById('userSearch').value.trim();const{data}=await(await fetch(`/api/admin/users?page=1&size=20&keyword=${encodeURIComponent(q)}`,{headers:headers()})).json();loadUsers(document.getElementById('tabContent'))}
async function banUser(id){const reason=prompt('封禁理由：');if(!reason)return;await fetch(`/api/admin/users/${id}/ban`,{method:'PUT',headers:headers(),body:JSON.stringify({reason})});loadUsers(document.getElementById('tabContent'))}
async function unbanUser(id){await fetch(`/api/admin/users/${id}/unban`,{method:'PUT',headers:headers()});loadUsers(document.getElementById('tabContent'))}
async function resetPwd(id){if(!confirm('确定重置密码为 123456？'))return;await fetch(`/api/admin/users/${id}/reset-password`,{method:'PUT',headers:headers()});alert('已重置')}
async function forceNick(id){const nick=prompt('新昵称：');if(!nick)return;await fetch(`/api/admin/users/${id}/nickname`,{method:'PUT',headers:headers(),body:JSON.stringify({nickname:nick})});loadUsers(document.getElementById('tabContent'))}

// ===== 内容管理 =====
async function loadPosts(el){const{data}=await(await fetch('/api/admin/posts?page=1&size=20',{headers:headers()})).json();el.innerHTML=`<div class="panel"><h3>帖子管理</h3><table><tr><th>ID</th><th>作者</th><th>内容</th><th>状态</th><th>操作</th></tr>${data.list.map(p=>`<tr><td>${p.id}</td><td>${esc(p.nickname)}</td><td>${esc(p.content).substring(0,30)}...</td><td>${p.status===0?'正常':p.status===1?'<span style="color:gold">隐藏</span>':'<span style="color:var(--like)">删除</span>'}</td><td class="actions">${p.status===0?`<button class="btn btn-outline" onclick="hidePost(${p.id})">隐藏</button>`:`<button class="btn btn-outline" onclick="restorePost(${p.id})">恢复</button>`}<button class="btn btn-outline" onclick="pinPost(${p.id})">置顶</button><button class="btn btn-outline" onclick="featurePost(${p.id})">加精</button><button class="btn btn-danger" onclick="delPost(${p.id})">删除</button></td></tr>`).join('')}</table></div>`}
async function hidePost(id){await fetch(`/api/admin/posts/${id}/hide`,{method:'PUT',headers:headers()});loadPosts(document.getElementById('tabContent'))}
async function restorePost(id){await fetch(`/api/admin/posts/${id}/restore`,{method:'PUT',headers:headers()});loadPosts(document.getElementById('tabContent'))}
async function pinPost(id){await fetch(`/api/admin/posts/${id}/pin`,{method:'PUT',headers:headers()});alert('已置顶')}
async function featurePost(id){await fetch(`/api/admin/posts/${id}/feature`,{method:'PUT',headers:headers()});alert('已加精')}
async function delPost(id){if(!confirm('确定删除？'))return;await fetch(`/api/admin/posts/${id}`,{method:'DELETE',headers:headers()});loadPosts(document.getElementById('tabContent'))}

// ===== 举报管理 =====
async function loadReports(el){const{data}=await(await fetch('/api/admin/reports?status=0&page=1&size=20',{headers:headers()})).json();el.innerHTML=`<div class="panel"><h3>待处理举报</h3>${data.list.length===0?'<div class="empty">暂无待处理举报</div>':`<table><tr><th>ID</th><th>类型</th><th>对象ID</th><th>理由</th><th>操作</th></tr>${data.list.map(r=>`<tr><td>${r.id}</td><td>${r.targetType}</td><td>${r.targetId}</td><td>${esc(r.reason)}</td><td class="actions"><button class="btn" onclick="resolveReport(${r.id})">处理</button><button class="btn btn-outline" onclick="rejectReport(${r.id})">驳回</button></td></tr>`).join('')}</table>`}</div>`}
async function resolveReport(id){const result=prompt('处理结果：','内容已隐藏');if(!result)return;await fetch(`/api/admin/reports/${id}/resolve`,{method:'PUT',headers:headers(),body:JSON.stringify({result})});loadReports(document.getElementById('tabContent'))}
async function rejectReport(id){await fetch(`/api/admin/reports/${id}/reject`,{method:'PUT',headers:headers()});loadReports(document.getElementById('tabContent'))}

// ===== 敏感词 =====
async function loadWords(el){const{data}=await(await fetch('/api/admin/sensitive-words',{headers:headers()})).json();el.innerHTML=`<div class="panel"><h3>敏感词管理</h3><div class="toolbar"><input id="newWord" placeholder="添加敏感词" style="width:200px"><button class="btn" onclick="addWord()">添加</button></div><table><tr><th>ID</th><th>敏感词</th><th>操作</th></tr>${data.map(w=>`<tr><td>${w.id}</td><td>${esc(w.word)}</td><td><button class="btn btn-danger" onclick="delWord(${w.id})">删除</button></td></tr>`).join('')}</table></div>`}
async function addWord(){const word=document.getElementById('newWord').value.trim();if(!word)return;await fetch('/api/admin/sensitive-words',{method:'POST',headers:headers(),body:JSON.stringify({word})});loadWords(document.getElementById('tabContent'))}
async function delWord(id){await fetch(`/api/admin/sensitive-words/${id}`,{method:'DELETE',headers:headers()});loadWords(document.getElementById('tabContent'))}

// ===== 公告 =====
function loadAnnounce(el){el.innerHTML=`<div class="panel"><h3>发布公告</h3><input id="announceContent" placeholder="公告内容" style="width:100%;margin-bottom:10px"><button class="btn" onclick="publishAnnounce()">发布（全体用户收到通知）</button></div>`}
async function publishAnnounce(){const content=document.getElementById('announceContent').value.trim();if(!content)return;const r=await(await fetch('/api/admin/announcements',{method:'POST',headers:headers(),body:JSON.stringify({content})})).json();alert(r.code===200?'发布成功':r.msg)}

// ===== 操作日志 =====
async function loadLogs(el){const{data}=await(await fetch('/api/admin/logs?page=1&size=30',{headers:headers()})).json();el.innerHTML=`<div class="panel"><h3>操作日志</h3><table><tr><th>时间</th><th>操作</th><th>对象</th><th>详情</th></tr>${data.list.map(l=>`<tr><td>${new Date(l.createdAt).toLocaleString('zh-CN')}</td><td>${esc(l.action)}</td><td>${l.targetType||''} #${l.targetId||''}</td><td>${esc(l.detail)}</td></tr>`).join('')}</table></div>`}

// ===== 初始化 =====
if(token){document.getElementById('loginSection').classList.add('hidden');document.getElementById('adminSection').classList.remove('hidden');switchTab('dashboard',document.querySelector('.nav button'))}
</script>
</body>
</html>
