<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼象 · 小说讨论社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
            --like: #f85149; --green: #3fb950;
        }
        body { font-family: -apple-system, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 640px; margin: 0 auto; padding: 20px 16px; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 6px; }
        .subtitle { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 24px; }

        /* 顶栏用户信息 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .top-bar .user-info { font-size: 13px; color: var(--dim); }
        .top-bar .user-info strong { color: var(--accent); }
        .btn-logout { background: none; border: 1px solid var(--border); color: var(--dim); padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-logout:hover { border-color: var(--like); color: var(--like); }

        /* 登录/注册 */
        .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; max-width: 360px; margin: 60px auto; }
        .auth-box h2 { font-size: 18px; margin-bottom: 20px; text-align: center; }
        .auth-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; margin-bottom: 12px; }
        .auth-box input:focus { border-color: var(--accent); outline: none; }
        .auth-box .btn-primary { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 4px; }
        .auth-box .btn-primary:hover { opacity: .85; }
        .auth-box .switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--dim); }
        .auth-box .switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
        .auth-box .error { color: var(--like); font-size: 13px; margin-bottom: 10px; text-align: center; display: none; }

        /* 小说选择 */
        .novel-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .novel-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; transition: all .2s; }
        .novel-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .novel-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        /* 发帖框 */
        .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
        .composer textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; margin-bottom: 10px; resize: none; font-family: inherit; }
        .composer input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; margin-bottom: 10px; }
        .composer textarea:focus, .composer input:focus { border-color: var(--accent); outline: none; }
        .btn-send { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-send:hover { opacity: .85; }

        /* 帖子卡片 */
        .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .post-nick { font-weight: 600; font-size: 14px; color: var(--accent); }
        .post-time { font-size: 12px; color: var(--dim); }
        .post-content { font-size: 14px; line-height: 1.7; margin-bottom: 10px; white-space: pre-wrap; }
        .post-quote { border-left: 3px solid var(--accent); padding: 8px 12px; background: rgba(88,166,255,.06); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--dim); margin-bottom: 10px; }
        .post-actions { display: flex; gap: 16px; font-size: 13px; color: var(--dim); }
        .post-actions span { cursor: pointer; transition: color .2s; }
        .post-actions .like-btn:hover { color: var(--like); }
        .post-actions .del-btn:hover { color: var(--like); }

        /* 评论区 */
        .comments { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
        .comment-item { font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
        .comment-item .c-nick { color: var(--accent); font-weight: 500; }
        .comment-item .c-reply { color: var(--dim); }
        .comment-item .c-reply-btn { color: var(--dim); font-size: 12px; cursor: pointer; margin-left: 6px; }
        .comment-item .c-reply-btn:hover { color: var(--accent); }
        .comment-form { display: flex; gap: 8px; margin-top: 10px; }
        .comment-form input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 13px; }
        .comment-form input:focus { border-color: var(--accent); outline: none; }
        .comment-form button { padding: 7px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }

        .empty { text-align: center; color: var(--dim); padding: 40px; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>拼象</h1>
    <p class="subtitle">一千个读者，拼出一头完整的大象</p>

    <!-- 登录/注册 -->
    <div id="authSection">
        <div class="auth-box">
            <h2 id="authTitle">登录</h2>
            <div class="error" id="authError"></div>
            <input id="authUsername" placeholder="用户名">
            <input id="authPassword" type="password" placeholder="密码">
            <input id="authNickname" placeholder="昵称（注册时填写）" class="hidden">
            <button class="btn-primary" id="authBtn" onclick="doAuth()">登录</button>
            <div class="switch" id="authSwitch">没有账号？<a onclick="toggleAuthMode()">注册</a></div>
        </div>
    </div>

    <!-- 主内容 -->
    <div id="mainSection" class="hidden">
        <div class="top-bar">
            <span class="user-info">当前用户：<strong id="displayNick"></strong></span>
            <button class="btn-logout" onclick="logout()">退出</button>
        </div>
        <div class="novel-bar" id="novelBar"></div>
        <div class="composer" id="composer" style="display:none">
            <textarea id="postContent" rows="3" placeholder="说说你对这本书的看法..."></textarea>
            <input id="postQuote" placeholder="引用原文（可选）">
            <button class="btn-send" onclick="submitPost()">发布</button>
        </div>
        <div id="feed"></div>
    </div>
</div>

<script>
let currentNovel = null;
let isRegister = false;
let token = localStorage.getItem('token') || '';
let myNick = localStorage.getItem('nickname') || '';
let myUserId = localStorage.getItem('userId') || '';
let currentReplyTo = {};

// ===== 认证 =====
function toggleAuthMode() {
    isRegister = !isRegister;
    document.getElementById('authTitle').textContent = isRegister ? '注册' : '登录';
    document.getElementById('authBtn').textContent = isRegister ? '注册' : '登录';
    document.getElementById('authNickname').classList.toggle('hidden', !isRegister);
    document.getElementById('authSwitch').innerHTML = isRegister
        ? '已有账号？<a onclick="toggleAuthMode()">登录</a>'
        : '没有账号？<a onclick="toggleAuthMode()">注册</a>';
    document.getElementById('authError').style.display = 'none';
}

async function doAuth() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    const nickname = document.getElementById('authNickname').value.trim();
    const errEl = document.getElementById('authError');

    const url = isRegister ? '/auth/register' : '/auth/login';
    const body = isRegister ? { username, password, nickname } : { username, password };

    try {
        const res = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const r = await res.json();
        if (r.code !== 200) { errEl.textContent = r.msg; errEl.style.display = 'block'; return; }
        token = r.data.token; myNick = r.data.nickname; myUserId = r.data.userId;
        localStorage.setItem('token', token);
        localStorage.setItem('nickname', myNick);
        localStorage.setItem('userId', myUserId);
        enterMain();
    } catch(e) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; }
}

function logout() {
    token = ''; myNick = ''; myUserId = '';
    localStorage.removeItem('token');
    localStorage.removeItem('nickname');
    localStorage.removeItem('userId');
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('mainSection').classList.add('hidden');
}

function enterMain() {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('mainSection').classList.remove('hidden');
    document.getElementById('displayNick').textContent = myNick;
    loadNovels();
}

// ===== API 工具 =====
function headers() {
    const h = { 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
}

// ===== 小说 =====
async function loadNovels() {
    const res = await fetch('/api/novels');
    const { data } = await res.json();
    document.getElementById('novelBar').innerHTML = data.map(n =>
        `<button class="novel-btn" data-id="${n.id}" onclick="selectNovel(${n.id}, this)">${n.title} (${n.postCount})</button>`
    ).join('');
}

function selectNovel(id, btn) {
    currentNovel = id;
    document.querySelectorAll('.novel-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('composer').style.display = 'block';
    loadPosts();
}

// ===== 帖子 =====
async function loadPosts() {
    const res = await fetch(`/api/posts?novelId=${currentNovel}`);
    const { data } = await res.json();
    const feed = document.getElementById('feed');
    if (!data || data.length === 0) { feed.innerHTML = '<div class="empty">还没有讨论，来发第一条吧</div>'; return; }
    feed.innerHTML = data.map(p => renderPost(p)).join('');
    data.forEach(p => loadComments(p.id));
}

function renderPost(p) {
    const time = new Date(p.createdAt).toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const quote = p.quoteText ? `<div class="post-quote">「${esc(p.quoteText)}」</div>` : '';
    const del = (String(p.userId) === String(myUserId)) ? `<span class="del-btn" onclick="deletePost(${p.id})">删除</span>` : '';
    return `
    <div class="post-card">
        <div class="post-header">
            <span class="post-nick">${esc(p.nickname)}</span>
            <span class="post-time">${time}</span>
        </div>
        <div class="post-content">${esc(p.content)}</div>
        ${quote}
        <div class="post-actions">
            <span class="like-btn" onclick="toggleLike(${p.id})">❤ ${p.likeCount || 0}</span>
            <span>💬 ${p.commentCount || 0}</span>
            ${del}
        </div>
        <div class="comments">
            <div class="comment-list" id="clist-${p.id}"></div>
            <div class="comment-form">
                <input id="cinput-${p.id}" placeholder="写评论..." onkeydown="if(event.key==='Enter')submitComment(${p.id})">
                <button onclick="submitComment(${p.id})">发送</button>
            </div>
        </div>
    </div>`;
}

async function submitPost() {
    const content = document.getElementById('postContent').value.trim();
    const quote = document.getElementById('postQuote').value.trim();
    if (!content) return;
    await fetch('/api/posts', { method: 'POST', headers: headers(), body: JSON.stringify({ novelId: currentNovel, content, quoteText: quote || null }) });
    document.getElementById('postContent').value = '';
    document.getElementById('postQuote').value = '';
    loadPosts(); loadNovels();
}

async function toggleLike(postId) {
    await fetch(`/api/posts/${postId}/like`, { method: 'POST', headers: headers() });
    loadPosts();
}

async function deletePost(postId) {
    if (!confirm('确定删除？')) return;
    await fetch(`/api/posts/${postId}`, { method: 'DELETE', headers: headers() });
    loadPosts(); loadNovels();
}

// ===== 评论 =====
async function loadComments(postId) {
    const res = await fetch(`/api/comments?postId=${postId}`);
    const { data } = await res.json();
    const list = document.getElementById(`clist-${postId}`);
    if (!list) return;
    list.innerHTML = (data || []).map(c => {
        const reply = c.replyTo ? `<span class="c-reply">回复 @${esc(c.replyTo)}：</span>` : '';
        return `<div class="comment-item"><span class="c-nick">${esc(c.nickname)}</span> ${reply}${esc(c.content)} <span class="c-reply-btn" onclick="setReply(${postId},'${esc(c.nickname)}')">回复</span></div>`;
    }).join('');
}

function setReply(postId, nick) {
    currentReplyTo[postId] = nick;
    const input = document.getElementById(`cinput-${postId}`);
    input.placeholder = `回复 @${nick}...`;
    input.focus();
}

async function submitComment(postId) {
    const input = document.getElementById(`cinput-${postId}`);
    const content = input.value.trim();
    if (!content) return;
    const replyTo = currentReplyTo[postId] || null;
    await fetch('/api/comments', { method: 'POST', headers: headers(), body: JSON.stringify({ postId, content, replyTo }) });
    input.value = '';
    input.placeholder = '写评论...';
    delete currentReplyTo[postId];
    loadComments(postId);
    loadPosts();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ===== 初始化 =====
if (token) { enterMain(); } 
</script>
</body>
</html>
