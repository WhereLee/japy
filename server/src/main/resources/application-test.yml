# 测试环境配置 — 跳过 RocketMQ 和 schema 初始化，避免依赖外部服务
spring:
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

# 禁用 RocketMQ（CI 环境没有 RocketMQ）
rocketmq:
  name-server: localhost:9876
  producer:
    group: test-producer-group

# 测试环境关闭 Knife4j
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.recloud: info
